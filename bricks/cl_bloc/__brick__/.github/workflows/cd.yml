name: CD — Build & Deploy

on:
  push:
    branches: [main]

# Required secrets to configure in your GitHub repo settings:
#   FIREBASE_APP_ID_ANDROID  — Firebase Android app ID
#   FIREBASE_APP_ID_IOS      — Firebase iOS app ID
#   FIREBASE_SERVICE_ACCOUNT — Firebase service account JSON (base64 encoded)
#   KEYSTORE_BASE64          — Android keystore file (base64 encoded)
#   KEY_ALIAS                — Android keystore key alias
#   KEY_PASSWORD             — Android keystore key password
#   STORE_PASSWORD           — Android keystore store password

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Run CI checks first
  # ──────────────────────────────────────────────────────────────────────────
  ci_check:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build Android APK (Release)
  # ──────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: ci_check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Decode and write keystore ──────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      # ── Upload APK as artifact ─────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Distribute via Firebase App Distribution ───────────────────────────
      - name: Distribute to Firebase App Distribution (Android)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Build iOS IPA (Release — requires macOS runner)
  # ──────────────────────────────────────────────────────────────────────────
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: ci_check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios && pod install

      - name: Build iOS (no codesign — for CI validation)
        run: flutter build ios --release --no-codesign

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Create GitHub Release with APK
  # ──────────────────────────────────────────────────────────────────────────
  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_android]

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Get version from pubspec.yaml
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Release v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## What's New
            Auto-release from CI/CD pipeline.
            **Commit:** ${{ github.sha }}
          files: app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
