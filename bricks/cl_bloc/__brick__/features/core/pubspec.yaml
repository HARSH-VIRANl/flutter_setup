name: core
description: "Core package containing shared utilities, network layer, themes, and base classes."
version: 0.0.1
homepage: none
publish_to: none
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: ">=3.24.0"

dependencies:
  cached_network_image: ^3.4.1
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  equatable: ^2.1.0
  external_path: ^3.0.0
  flutter:
    sdk: flutter
  fpdart: ^1.1.1
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.3
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.7.0
  lottie: ^3.5.1
  open_file: ^4.0.0
  permission_handler: ^13.0.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.9.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_gen:
  output: lib/src/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

flutter:
  assets:
    - assets/
    - assets/anim/
    - assets/svg/