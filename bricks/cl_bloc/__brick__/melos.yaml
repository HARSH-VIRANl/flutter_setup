name: {{{fullPath}}}

# Melos manages the monorepo: root app + features/core package
# Run `melos bootstrap` after cloning to link all packages

packages:
  - .
  - features/*

sdkPath: .fvm/flutter_sdk   # Use FVM if available; remove line if not using FVM

scripts:
  # ── Setup ──────────────────────────────────────────────────────────────────
  bootstrap:
    run: melos exec -- flutter pub get
    description: Install dependencies for all packages

  # ── Quality ────────────────────────────────────────────────────────────────
  analyze:
    run: melos exec -- flutter analyze --fatal-infos
    description: Run dart analyze across all packages

  format:
    run: melos exec -- dart format .
    description: Format all Dart code

  format:check:
    run: melos exec -- dart format --output=none --set-exit-if-changed .
    description: Check formatting (no changes made) — used in CI

  fix:
    run: melos exec -- dart fix --apply
    description: Apply dart fixes across all packages

  # ── Testing ────────────────────────────────────────────────────────────────
  test:
    run: melos exec --fail-fast -- flutter test
    description: Run tests across all packages

  test:coverage:
    run: melos exec -- flutter test --coverage
    description: Run tests with coverage

  # ── Build ──────────────────────────────────────────────────────────────────
  build:android:
    run: flutter build apk --release
    description: Build Android release APK

  build:ios:
    run: flutter build ios --release --no-codesign
    description: Build iOS release (no codesign)

  build:runner:
    run: melos exec --depends-on="build_runner" -- flutter pub run build_runner build --delete-conflicting-outputs
    description: Run build_runner for code generation (json_serializable, flutter_gen etc.)

  # ── Code Generation ────────────────────────────────────────────────────────
  gen:page:
    run: mason make cl_page -o lib/screens
    description: Generate a new BLoC page/feature in lib/screens (e.g. melos run gen:page -- --name profile)

  # ── Cleanup ────────────────────────────────────────────────────────────────
  clean:
    run: melos exec -- flutter clean
    description: Clean all packages
